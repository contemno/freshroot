# fixture.conf — configuration for the QEMU test image. Sourced by
# build-image.sh (bash). TEST FIXTURE ONLY — nothing here is a production
# default.

# LUKS passphrase for the disposable image (also what e2e.py types).
PASSPHRASE="freshroot-test"

# Raw disk image size and path (relative paths resolve against test/rig).
DISK_SIZE="10G"
DISK_IMG="disk.img"

# apt mirror for mmdebstrap/debootstrap.
MIRROR="http://archive.ubuntu.com/ubuntu"
SUITE="noble"

# Fixed snapshot names so e2e.py can match them deterministically.
# SNAP_OLD is taken first; /etc/fixture-marker ("second") is written to @
# before SNAP_NEW, so the two boots are distinguishable from inside.
SNAP_OLD="root.ubuntu-24.04.20260820T120000"
SNAP_NEW="root.ubuntu-24.04.20260822T090000"
DEFAULT_LINEAGE="ubuntu-24.04"

# A second store entry (a copy of the real UKI under a fake, older kver)
# so the kernel picker has something to cycle to.
FAKE_KVER="0.0.0-fake"

# Root password for the serial login in e2e tests.
ROOT_PASSWORD="freshroot"

# dm name stage 1 opens and the fixture crypttab uses.
DM_NAME="crypt-root"

# Secure Boot test keys (generated by build-image.sh into sb/ next to the
# image; enrolled into the OVMF vars copy the SB scenario boots with).
SB_DIR="sb"
