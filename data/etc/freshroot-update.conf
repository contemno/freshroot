# /etc/freshroot-update.conf
# Configuration for the immutable root update system

# ── Post-update scripts ───────────────────────────────────────────
# Git repositories to clone and run after apt upgrades.
# Each repo must contain an executable ./install.sh at its root.
# Repos are processed in order. Each is cloned into a temp directory,
# ./install.sh is run, and the clone is removed afterward.
#
# Example:
#   REPOS=(
#       "https://github.com/example/desktop-config.git"
#       "https://github.com/example/security-hardening.git"
#   )
REPOS=(
)

# ── BTRFS layout ─────────────────────────────────────────────────
# Subvolume names (relative to btrfs top-level)
ROOT_SUBVOL="@"
SNAPSHOTS_DIR="@snapshots"
ROOTFS_SUBVOL="@rootfs"
STAGING_SUBVOL="@staging"

# Pinned base subvolume used by freshroot-build (two-tier builds). Persistent,
# writable, NOT under @snapshots and NOT named root.*, so GRUB and pruning ignore
# it. freshroot-build applies vanilla apt upgrades here, then layers components
# from a fresh clone. freshroot-update does not use this.
BASE_SUBVOL="@base"

# Run cloud-init during freshroot-build's component layer (TIER 2). 0 = skip.
# (freshroot-update always runs cloud-init; freshroot-build makes it opt-in.)
BUILD_RUN_CLOUD_INIT=0

# ── Snapshot retention ───────────────────────────────────────────
# Retention is PER LINEAGE. A lineage is an install line of snapshots
# (root.<lineage>.<timestamp>, e.g. "ubuntu-24.04"; created alongside the
# current one by freshroot-install). Legacy root.<timestamp> snapshots are
# grouped by the os-release inside them.
#
# MAX_SNAPSHOTS is the quota for any lineage WITHOUT an explicit
# LINEAGE_QUOTAS entry (0 = unlimited). NOTE: with several lineages the
# total number of retained snapshots is the SUM of the per-lineage quotas.
MAX_SNAPSHOTS=10

# Per-lineage quota overrides, entries of the form "lineage=N"
# (0 = unlimited). Example:
#   LINEAGE_QUOTAS=(
#       "ubuntu-24.04=10"
#       "ubuntu-26.04=3"
#   )
LINEAGE_QUOTAS=(
)

# ── Kernel store (freshroot-kernel) ──────────────────────────────
# Kernels are managed OUTSIDE apt: modules live on the persistent
# MODULES_SUBVOL (mounted at /usr/lib/modules and shared by every
# snapshot), and each kernel is compiled into a UKI stored under
# <MODULES_SUBVOL>/.freshroot/uki/ that the stage-1 boot menu kexecs.
# Firmware lives on FIRMWARE_SUBVOL (mounted at /usr/lib/firmware) so it
# travels with the kernels, not the snapshots.
MODULES_SUBVOL="@modules"
FIRMWARE_SUBVOL="@firmware"

# How many kernels `freshroot-kernel gc` keeps (newest first; the running
# kernel and the stage-1 kernel are always kept).
KERNEL_KEEP=3

# Where `freshroot-kernel add --mainline/--latest` fetches builds from,
# and which package flavour/architecture to pick there.
MAINLINE_MIRROR="https://kernel.ubuntu.com/mainline"
KERNEL_FLAVOUR="generic"
KERNEL_ARCH="amd64"

# Stage-1 boot menu: countdown before the default entry boots (0 = wait),
# and extra kernel parameters baked into the stage-1 UKI's cmdline
# (e.g. "console=ttyS0,115200n8"). Rebuild with `freshroot-kernel stage1`.
STAGE1_TIMEOUT=5
STAGE1_CMDLINE_EXTRA=""

# ── Secure Boot signing ───────────────────────────────────────────
# Directory holding db.key + db.crt (PEM) — the OWNER's db key enrolled in
# firmware. Empty = <btrfs top-level>/freshroot-state/sb (root-only,
# never inside a snapshot). Kernels and UKIs are signed when the key is
# present, left unsigned (with a warning) otherwise.
SB_KEY_DIR=""
# Optional PKCS#11 URI of a token-held key (sbsign --engine pkcs11);
# SB_KEY_DIR then needs only db.crt.
SB_KEY_URI=""

# ── Boot partitions ──────────────────────────────────────────────
# EFI_PARTITION is the ESP the stage-1 UKI is installed to.
# BOOT_PARTITION is the legacy unencrypted /boot: only read by
# `freshroot-kernel adopt` to import apt-era kernels during migration.
BOOT_PARTITION="/boot"
EFI_PARTITION="/boot/efi"

# ── Logging ──────────────────────────────────────────────────────
LOG_DIR="/var/log/freshroot-update"

# ── Bind mounts into the staging container ──────────────────────
# Extra host paths to expose inside the nspawn staging container.
# Each entry is "HOST_PATH:CONTAINER_PATH[:ro]". The :ro suffix makes
# it read-only (recommended for source trees and secrets).
#
# Useful for local dev (test a playbook before pushing it to a repo)
# or for shipping host-side secrets/keys into provisioning.
#
# A REPOS entry of the form "local:///path/inside/container" will skip
# git clone and run ./install.sh directly from that path — pair this
# with a bind mount to test uncommitted code.
#
# Example:
#   BIND_MOUNTS=(
#       "/home/joshua/myplaybook:/srv/playbook:ro"
#   )
#   REPOS=(
#       "local:///srv/playbook"
#   )
BIND_MOUNTS=(
)

# ── Edition label ────────────────────────────────────────────────
# Free-form label (conventionally workstation or server) recorded for
# tooling; leave empty for unlabeled "Freshroot".
EDITION=""
