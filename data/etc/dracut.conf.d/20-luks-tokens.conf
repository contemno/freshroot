# shellcheck shell=bash
# /etc/dracut.conf.d/20-luks-tokens.conf
#
# Dracut configuration for LUKS unlock support in the initramfs.
# This file is a shell script sourced by dracut. Each block adds dracut
# modules and the matching libcryptsetup token plugin only when the
# relevant userspace pieces are installed, so it is safe to ship
# unconditionally.
#
# The guards test for FILES, never dpkg package names: library package
# names change on ABI bumps (noble's time_t transition renamed
# libtss2-esys-3.0.2-0 to libtss2-esys-3.0.2-0t64, silently defeating a
# dpkg -s guard and leaving the TPM libraries out of the initramfs).
#
# The dracut fido2/tpm2-tss modules install the token plugins and their
# libraries themselves; the install_items below are belt-and-braces in
# case a module version drops the plugin.

# FIDO2 token support (requires libfido2)
_dl_have_fido2=""
for _f in /usr/lib/*/cryptsetup/libcryptsetup-token-systemd-fido2.so; do
    [ -e "$_f" ] && _dl_have_fido2=1
done
for _f in /usr/lib/*/libfido2.so.*; do
    [ -e "$_f" ] || _dl_have_fido2=""
done
if [ -n "$_dl_have_fido2" ]; then
    add_dracutmodules+=" fido2 "
    for _f in /usr/lib/*/cryptsetup/libcryptsetup-token-systemd-fido2.so; do
        [ -e "$_f" ] && install_items+=" $_f "
    done
fi

# TPM2 support (requires libtss2). The tpm2-tss dracut module's check()
# requires the tpm2 binary (tpm2-tools) — without it, add_dracutmodules
# hard-fails the whole initramfs build, so gate on that too.
_dl_have_tpm2=""
for _f in /usr/lib/*/cryptsetup/libcryptsetup-token-systemd-tpm2.so; do
    [ -e "$_f" ] && _dl_have_tpm2=1
done
for _f in /usr/lib/*/libtss2-esys.so.*; do
    [ -e "$_f" ] || _dl_have_tpm2=""
done
command -v tpm2 >/dev/null 2>&1 || _dl_have_tpm2=""
if [ -n "$_dl_have_tpm2" ]; then
    add_dracutmodules+=" tpm2-tss "
    for _f in /usr/lib/*/cryptsetup/libcryptsetup-token-systemd-tpm2.so; do
        [ -e "$_f" ] && install_items+=" $_f "
    done
fi
unset _f _dl_have_fido2 _dl_have_tpm2

# Unmatched globs leave the last `[ -e ... ] && ...` false, so this file
# would otherwise end on a non-zero status. Harmless with dracut today;
# cheap insurance if it ever sources config under `set -e`.
:
