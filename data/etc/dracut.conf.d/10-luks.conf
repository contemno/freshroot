# shellcheck shell=bash
# /etc/dracut.conf.d/10-luks.conf
#
# Unlock the LUKS root from the initramfs.
#
# The unlock parameters themselves are NOT set here — they are added to the
# kernel command line by /etc/default/grub.d/99-dracut-luks.cfg at
# update-grub time. hostonly_cmdline="no" keeps it that way: without it,
# dracut bakes a command line into the image, and a later UUID change would
# need an initramfs rebuild instead of just update-grub.
add_dracutmodules+=" crypt dm rootfs-block "
hostonly="yes"
hostonly_cmdline="no"
