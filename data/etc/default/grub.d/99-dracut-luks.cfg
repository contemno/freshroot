# shellcheck shell=sh
# /etc/default/grub.d/99-dracut-luks.cfg
#
# Append the dracut LUKS unlock parameters to the kernel command line.
#
# grub-mkconfig sources /etc/default/grub and then every /etc/default/grub.d/
# *.cfg in sort order, so this file runs as shell code at update-grub time —
# which is why the UUID does not have to be baked in anywhere. Re-encrypt the
# disk, clone it, or change the mapping name, and the next update-grub picks
# up the new values on its own.
#
# 99- so it sees whatever earlier drop-ins have set.
#
# This runs inside grub-mkconfig's `set -e`: nothing here may return non-zero.

_dl_lib="${DL_LIB:-/usr/lib/dracut-luks/discover.sh}"
if [ -r "$_dl_lib" ]; then
    # shellcheck source=../../../usr/lib/dracut-luks/discover.sh
    . "$_dl_lib"

    # An explicit rd.luks.uuid= from the admin wins — a second one from here
    # would set up a conflicting unlock mapping.
    case " ${GRUB_CMDLINE_LINUX:-} ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
        *rd.luks.uuid=*)
            : ;;
        *)
            # Bare calls would abort update-grub on an unencrypted root,
            # which is a supported configuration and not an error.
            if dracut_luks_discover && [ -n "$DL_PARAMS" ]; then
                GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+${GRUB_CMDLINE_LINUX} }${DL_PARAMS}"

                # Enrolled TPM2/FIDO2 tokens need tpm2-device=auto /
                # fido2-device=auto on the entry, or systemd-cryptsetup skips
                # its native token path and the generic plugin path can
                # invent a PIN prompt for a token enrolled without one.
                # UUID-scoped so other LUKS devices are unaffected; an
                # admin-set rd.luks.options= wins, same as rd.luks.uuid=.
                case " ${GRUB_CMDLINE_LINUX:-} ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
                    *rd.luks.options=*)
                        : ;;
                    *)
                        if dracut_luks_tokens && [ -n "$DL_TOKEN_OPTS" ]; then
                            GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} rd.luks.options=${DL_LUKS_UUID}=${DL_TOKEN_OPTS}"
                        fi
                        ;;
                esac
            fi
            ;;
    esac
fi
unset _dl_lib

:
