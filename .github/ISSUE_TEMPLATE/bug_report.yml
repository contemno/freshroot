name: 🐞 Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in as much as you can — logs and
        environment details are the most useful parts for diagnosing problems.

        **Never paste secrets.** Scrub LUKS passphrases, tokens, and private
        repo URLs (the `REPOS` array in `freshroot-update.conf` may contain
        credentials embedded in git URLs) before attaching logs or config.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: This is a bug, not a usage question (those go to Discussions)
          required: true
        - label: This is not a security vulnerability (those go to a private advisory)
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Where does the problem appear? Pick the closest match.
      multiple: true
      options:
        - Installer bootstrap (installer/freshroot-setup)
        - Updates (freshroot-update, timer/service)
        - From-scratch builds (freshroot-build)
        - Lineage management (freshroot-install)
        - Boot / initramfs (90freshroot dracut module)
        - GRUB entries (06_freshroot)
        - Persistent subvolumes / fstab
        - Packaging (debian/, Makefile)
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior, including any error text.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        For update problems: `journalctl -u freshroot-update.service
        --no-pager` and the run log under `/var/log/freshroot-update/`. For
        boot problems: `journalctl -b --no-pager | grep -i freshroot`. Scrub
        anything secret.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: "`dpkg -s freshroot | grep Version`, a release tag, or a git commit."
      placeholder: "e.g. 1.0.0, or commit af37d21"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: >-
        Ubuntu release, and whether the system was booted clean (from a
        snapshot, `rd.freshroot` on the kernel cmdline) or tainted (@).
      placeholder: "e.g. Ubuntu 24.04, clean boot from root.noble.20260815T031200"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >-
        Snapshot list (`btrfs subvolume list`), config snippets, related
        issues.
