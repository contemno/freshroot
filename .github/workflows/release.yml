name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: read-only by default; only the release job elevates to
# contents: write for publishing the GitHub release.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck dpkg-dev

      # make lint keeps the Makefile SCRIPTS variable the single source of
      # truth for which scripts are checked
      - name: Shellcheck scripts
        run: make lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    container:
      image: ubuntu:noble
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            build-essential \
            dpkg-dev \
            debhelper \
            git

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          if echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            DEB_VERSION="${TAG}-1"
            PRERELEASE="false"
          else
            DEB_VERSION="$(echo "$TAG" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)-(.+)\.([0-9]+)/\1~\2\3/')-1"
            PRERELEASE="true"
          fi
          echo "deb_version=${DEB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${DEB_VERSION} (prerelease=${PRERELEASE})"

      - name: Stamp debian/changelog from annotated tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${{ steps.version.outputs.deb_version }}"

          # actions/checkout fetches annotated tag objects only when the
          # tag ref was created on the remote before the fetch. Re-fetch
          # the tag explicitly so %(contents) has a tag object to read.
          git config --global --add safe.directory "$PWD"
          git fetch --no-recurse-submodules --force origin \
            "+refs/tags/${TAG}:refs/tags/${TAG}" || true

          # Pull the tag message body (empty for lightweight tags)
          MSG=$(git for-each-ref --format='%(contents)' "refs/tags/${TAG}" || true)
          MSG="${MSG%$'\n'}"
          if [ -z "$MSG" ]; then
            echo "WARNING: no annotated tag message for ${TAG}; using stub" >&2
            MSG="Release ${TAG}"
          fi

          # Format tag message as changelog entries. Each non-empty line
          # becomes "  * <line>" unless it's already bulleted/indented.
          ENTRIES=$(printf '%s\n' "$MSG" | awk '
            /^[[:space:]]*$/ { print ""; next }
            /^[[:space:]]*\*/ { print "  " $0; next }
            /^[[:space:]]/   { print $0; next }
                             { print "  * " $0 }
          ')

          DATE=$(date -R)
          {
            printf '%s\n\n' "freshroot (${VERSION}) noble; urgency=medium"
            printf '%s\n\n' "${ENTRIES}"
            printf '%s\n\n' " -- GitHub Actions <actions@github.com>  ${DATE}"
            cat debian/changelog
          } > debian/changelog.new
          mv debian/changelog.new debian/changelog
          head -30 debian/changelog

          # Sanity-check the generated stanza parses cleanly.
          dpkg-parsechangelog -l debian/changelog >/dev/null

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          set -eux
          mkdir -p artifacts
          cp ../*.deb ../*.buildinfo ../*.changes artifacts/
          install -m 0755 installer/freshroot-setup artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: freshroot
          path: artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            artifacts/*.deb
            artifacts/freshroot-setup
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
