name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here needs more than a read-only token.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck dpkg-dev

      # make lint keeps the Makefile SCRIPTS variable the single source of
      # truth for which scripts are checked
      - name: Shellcheck scripts
        run: make lint

  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            build-essential \
            dpkg-dev \
            debhelper \
            git

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Verify package contents
        run: |
          set -eux
          dpkg-deb -c ../freshroot_*.deb
          dpkg-deb -I ../freshroot_*.deb
