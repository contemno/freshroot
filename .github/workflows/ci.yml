name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck scripts
        run: |
          shellcheck -s bash \
            data/usr/sbin/freshroot-update \
            installer/freshroot-setup \
            data/usr/lib/dracut/modules.d/90freshroot/module-setup.sh \
            data/usr/lib/dracut/modules.d/90freshroot/freshroot-setup.sh \
            data/usr/lib/dracut/modules.d/90freshroot/freshroot-generator \
            data/etc/grub.d/06_freshroot

  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            build-essential \
            dpkg-dev \
            debhelper \
            git

      - uses: actions/checkout@v4

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Verify package contents
        run: |
          set -eux
          dpkg-deb -c ../freshroot_*.deb
          dpkg-deb -I ../freshroot_*.deb
